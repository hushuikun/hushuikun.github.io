<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f2">
    <meta name="description" content="Hu Shuikun 的漫画照片时间线。">
    <meta property="og:title" content="漫画回忆录 | Hu Shuikun">
    <meta property="og:description" content="Hu Shuikun 的漫画照片时间线。">
    <meta property="og:type" content="website">
    <title>Hu Shuikun</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./data/memories.js" defer></script>
    <script src="./data/memoirs.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="brand-bar">
      <div class="brand-bar-inner">
        <a class="brand-lockup" href="#timeline-panel" aria-label="Hu Shuikun 时间线">
          <span class="brand-monogram" aria-hidden="true">H.</span>
          <span>HU SHUIKUN</span>
        </a>
      </div>
    </header>
    <nav class="section-tabs-wrap" aria-label="内容分类">
      <div class="section-tabs" role="tablist">
        <button class="section-tab" id="timeline-tab" type="button" role="tab" aria-selected="true" aria-controls="timeline-panel">时间线</button>
        <button class="section-tab" id="memoirs-tab" type="button" role="tab" aria-selected="false" aria-controls="memoirs-panel" tabindex="-1">回忆录</button>
      </div>
    </nav>
    <main>
      <section class="timeline-section tab-panel" id="timeline-panel" role="tabpanel" aria-labelledby="timeline-tab" tabindex="0">
        <div class="timeline-toolbar">
          <div class="year-filters" id="year-filters" role="group" aria-label="按年份筛选"></div>
          <p class="entry-count" id="entry-count" aria-live="polite"></p>
        </div>

        <div class="timeline-list" id="timeline-list" aria-live="polite">
        </div>
      </section>
      <section class="memoirs-section tab-panel" id="memoirs-panel" aria-labelledby="memoirs-tab" role="tabpanel" tabindex="0" hidden>
        <div class="memoir-list" id="memoir-list" aria-live="polite"></div>
      </section>
    </main>

    <dialog class="memory-dialog" id="memory-dialog" aria-labelledby="dialog-title">
      <button class="dialog-close" type="button" aria-label="关闭">×</button>
      <div class="dialog-image-wrap"><img class="dialog-image" src="" alt=""></div>
      <div class="dialog-details">
        <p class="dialog-date"></p>
        <h2 id="dialog-title"></h2>
        <p class="dialog-text" hidden></p>
        <p class="dialog-location" hidden></p>
      </div>
    </dialog>
  </body>
</html>
